[project]
name = "ppg-dalia-final-iot"
version = "0.1.0"
description = "PPG-ACC heart-rate estimation and CPU FP32/8-bit comparison for the final AI-IoT project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "torch==2.10.0",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.64,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
